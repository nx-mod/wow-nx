[package]
name = "benilla-horizon"
description = "wow-nx: what the Switch (Horizon, libnx) gives Rust that its C library lacks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Only on the Switch target; elsewhere the crate is empty.
[target.'cfg(target_os = "horizon")'.dependencies]
# `custom`: getrandom 0.2 knows Horizon only on 32-bit ARM (the 3DS). Feature unification turns it on for rand's copy.
getrandom = { version = "0.2", features = ["custom"] }
# 0.3 and 0.4 take the `custom` backend from `--cfg getrandom_backend="custom"` (switch/entorno.sh) and call
# `__getrandom_v03_custom`, defined here with 0.3's error type (0.4's has the same layout).
getrandom03 = { package = "getrandom", version = "0.3" }
