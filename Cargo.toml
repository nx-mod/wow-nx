[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sam <samuv.eth@gmail.com>"]

# A version two crates share is pinned in `[workspace.dependencies]`; feature additions stay per
# crate. `image` stays per-crate: its consumers differ on default features, and a member cannot
# turn off default features that a workspace entry enables.
# `too_many_arguments` is off: a Bevy system's parameter list is its dependency declaration.
[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
anyhow = "1.0.102"
# bevy's default features spelled out without `audio`: `2d`, `3d` and `ui` each pull `bevy_audio`
# and `vorbis`, and the client mixes through kira. Add a feature by name, never `2d`/`3d`/`ui`; a
# plugin that takes bevy with its default features brings the audio stack back too.
#
# wow-nx: the bundles' features one by one, without `default_platform` or `custom_cursor` (which turn on winit): the
# Switch has neither. benilla-app adds those two back everywhere else, so the PC build has the same set as upstream.
bevy = { version = "0.18.1", default-features = false, features = [
    # default_app, without custom_cursor
    "async_executor", "bevy_asset", "bevy_input_focus", "bevy_log", "bevy_state", "bevy_window", "reflect_auto_register",
    # common_api
    "bevy_animation", "bevy_camera", "bevy_color", "bevy_gizmos", "bevy_image", "bevy_mesh", "bevy_shader", "bevy_text",
    "hdr", "png",
    # 2d_bevy_render
    "bevy_sprite", "bevy_sprite_render", "bevy_post_process", "bevy_gizmos_render",
    # 3d_bevy_render
    "bevy_light", "bevy_mikktspace", "ktx2", "morph_animation", "morph", "smaa_luts", "tonemapping_luts", "zstd_rust",
    "bevy_render", "bevy_core_pipeline", "bevy_anti_alias", "bevy_gltf", "bevy_pbr", "gltf_animation",
    # ui_api, ui_bevy_render
    "bevy_ui", "bevy_ui_render",
    "scene",
    "picking",
    # the Switch's part of default_platform
    "std", "multi_threaded", "default_font",
] }
# For the `WOW_GPU_MS` meter's query set, which bevy 0.18 does not wrap; must match bevy's wgpu.
wgpu = "27"
clap = { version = "4.6.1", features = ["derive"] }
sha1 = "0.10.6"

[patch.crates-io]
# kira 0.12.4, patched to compute spatial gains and the volume tween per output chunk and
# interpolate them, not per sample frame (`third_party/kira/BENILLA.md`).
kira = { path = "third_party/kira" }
# A lock-only stand-in: bevy_audio's unbuilt cpal 0.15 would otherwise hold `alsa-sys` 0.3 against
# cpal 0.17's 0.4, and a lock holds one `links = "alsa"` (`third_party/alsa-0.9/BENILLA.md`).
alsa = { path = "third_party/alsa-0.9" }
# wow-nx: libc with devkitA64's types for the Switch (third_party/libc/WOW-NX.md): the same 0.2.186 as the lock, with
# changes only under target_os = "horizon" on aarch64.
libc = { path = "third_party/libc" }
# wow-nx: wgpu-hal 27 with a deko3d backend standing in for GLES on Horizon (docs/SWITCH-RENDER.md), and upstream's
# Vulkan presentation-stall patch (third_party/wgpu-hal/BENILLA.md).
wgpu-hal = { path = "third_party/wgpu-hal" }
# wow-nx: wgpu and wgpu-core as upstream, except that their GL backend is built on Horizon too.
wgpu = { path = "third_party/wgpu" }
wgpu-core = { path = "third_party/wgpu-core" }
# wow-nx: one cfg each for the Switch: bevy_asset without the async-io reactor, memmap2 without mmap.
bevy_asset = { path = "third_party/bevy_asset" }
memmap2 = { path = "third_party/memmap2" }

# Dependencies at opt-level 3 in dev: at opt-level 0, avian/parry collision drops a run to <1 fps.
[profile.dev.package."*"]
opt-level = 3
# One codegen unit each, since `lto = "off"` below drops the ThinLTO that inlines across a crate's
# units: at 16 units the dependencies cost +1.2 cpu_ms at the leg pin, at one nothing, and a cold
# build is no slower.
codegen-units = 1

# The movie decoder at opt-level 3 in dev as well: at 1, decoding the 1024-wide intro takes its
# install test 29 s, at 3 under 6 s.
[profile.dev.package.benilla-movie]
opt-level = 3

# Our crates at opt-level 1: Bevy's generic hot paths monomorphize into them, and at opt-level 0
# Stormwind drops from a pinned 60 fps to ~45.
[profile.dev]
opt-level = 1
# No ThinLTO: above opt-level 0 rustc runs it over a crate's own codegen units by default, and an
# incremental rebuild redoes it whole: 19 s of a one-line `benilla-app` edit's 25 s, and half its
# 5.3 GB. Off, our crates cost +0.7 cpu_ms (+6 %) at the leg pin.
lto = "off"

# No debuginfo trimming: `debug = "line-tables-only"` measures no recurring win on macOS + sccache.

# The shipping build (`--profile ship`): fat LTO measures -1.0 cpu_ms (-5 %) against `release`,
# which stays the measured profile because fat LTO's link time would tax every iteration.
# `-Ctarget-cpu=native` is not set: it is not portable.
# wow-nx: the Switch build (switch/build-benilla.sh), sized for the phone it is built on: no LTO and 16
# codegen units, so with -j2 LLVM holds two small units at a time instead of one huge one.
[profile.switch]
inherits = "release"
lto = "off"
codegen-units = 16
debug = false
incremental = false

[profile.switch.package."*"]
codegen-units = 16

# wow-nx: a release for the Switch (`WOWNX_SHIP=1 switch/build-benilla.sh`): `switch` with every dependency in one
# codegen unit, so Bevy's small hot functions inline within their crates (the profile's top entries were parameter
# checks and table lookups left as calls); upstream measured 16 units at +1.2 cpu_ms on desktop. Our crates stay at
# 16: `benilla-app` in one unit does not fit the phone that builds it. Build it single-job.
[profile.switch-ship]
inherits = "switch"

[profile.switch-ship.package."*"]
codegen-units = 1

[profile.ship]
inherits = "release"
lto = "fat"
codegen-units = 1

# `release` plus incremental, run as `cargo play`: under `release` a one-line edit to
# `benilla-app` costs 2m47s. Incremental applies to workspace members only, so dependencies stay
# sccache-cacheable; it changes codegen, so it lives here and not in the measured `release`.
[profile.play]
inherits = "release"
incremental = true
# Not for speed: under `incremental`, thin-local LTO leaves promoted `anon.*.llvm.*` symbols
# unresolved and the link fails intermittently (rustc #86049).
lto = "off"

# One codegen unit each, as in dev: at 16 the dependencies cost +1.2 cpu_ms against `release` at
# the leg pin, at one the profile is +0.5, and a cold build is no slower.
[profile.play.package."*"]
codegen-units = 1
