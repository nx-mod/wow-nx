[package]
name = "clear"
version = "0.1.0"
edition = "2021"
publish = false

# wow-nx render step 2 (docs/SWITCH-RENDER.md): wgpu on deko3d clears the screen, through the vendored wgpu-hal's
# deko3d backend in the GL slot.
[dependencies]
wgpu = { version = "27", default-features = false, features = ["gles", "wgsl", "std"] }
benilla-horizon = { path = "../../crates/benilla-horizon" }
pollster = "0.4"
log = "0.4"
raw-window-handle = "0.6"

[workspace]

[profile.release]
panic = "abort"
opt-level = "s"

[profile.dev]
panic = "abort"

[patch.crates-io]
libc = { path = "../../third_party/libc" }
wgpu-hal = { path = "../../third_party/wgpu-hal" }
wgpu = { path = "../../third_party/wgpu" }
wgpu-core = { path = "../../third_party/wgpu-core" }
